name: MLOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint source code
        run: python -m flake8 src/pipeline/ --max-line-length=100 --extend-ignore=E203,E302,E305,W292 --statistics

  test-suite:
    name: Test Suite
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run data pipeline
        run: |
          mkdir -p data/raw data/processed
          python -m src.pipeline.collect --output data/raw/iris_raw.csv
          python -m src.pipeline.preprocess --input data/raw/iris_raw.csv --output data/processed/iris_preprocessed.csv
          python -m src.pipeline.features --input data/processed/iris_preprocessed.csv --output data/processed/iris_features.csv
          python -m src.pipeline.validate --input data/processed/iris_features.csv

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  model-quality-gate:
    name: Model Quality Gate
    needs: test-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify model quality
        run: python -m pytest tests/test_model_quality.py -v
